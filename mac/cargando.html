<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DJ Request</title>
<style>
  html,body{margin:0;height:100%;background:#0b0a12;color:#f4f2ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
    background:radial-gradient(90% 60% at 50% 0%,rgba(124,92,255,.3),transparent 60%),#0b0a12}
  img{width:220px;border-radius:22px;box-shadow:0 10px 50px rgba(255,61,139,.3)}
  p{margin:0;color:#9b96b5}
  .dots::after{content:'';animation:d 1.4s steps(4) infinite}
  @keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
  button{font:inherit;font-weight:700;padding:12px 22px;border-radius:12px;border:0;cursor:pointer;color:#fff;
    background:linear-gradient(90deg,#ff3d8b,#7c5cff)}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <img src="../public/logo.jpg" alt="">
  <p id="msg">Despertando el servidor<span class="dots"></span><br><small>(puede tardar hasta un minuto)</small></p>
  <p id="err" hidden>No pude conectar con el servidor.<br>Revisa que tengas internet.</p>
  <button id="retry" hidden onclick="location.href='https://dj-request.onrender.com/dj'">Reintentar</button>
<script>
  if (new URLSearchParams(location.search).get('error')) {
    document.getElementById('msg').hidden = true;
    document.getElementById('err').hidden = false;
    document.getElementById('retry').hidden = false;
  }
</script>
</body>
</html>
