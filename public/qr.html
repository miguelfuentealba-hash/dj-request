<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pide tu canción — QR</title>
<link rel="icon" href="/icon.jpg">
<link rel="apple-touch-icon" href="/icon.jpg">
<style>
  :root{--bg:#0b0a12;--text:#f4f2ff;--muted:#9b96b5;--accent:#ff3d8b;--accent2:#7c5cff;--beer:#ffc23d}
  *{box-sizing:border-box} [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vmin;text-align:center;padding:4vmin;
    background:radial-gradient(90% 70% at 50% 0%,rgba(124,92,255,.35),transparent 60%),radial-gradient(70% 50% at 50% 110%,rgba(255,61,139,.25),transparent 60%),var(--bg)}
  .logo{width:min(40vmin,420px);aspect-ratio:1;object-fit:cover;border-radius:3vmin;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 10px 50px rgba(255,61,139,.28)}
  .side{display:flex;flex-direction:column;align-items:center;gap:2.4vmin}
  /* pantalla horizontal (proyector/TV): logo a la izquierda, QR a la derecha */
  @media (orientation:landscape){body{flex-direction:row;gap:7vw}.logo{width:min(62vmin,640px)}}
  .dj{font-size:clamp(16px,3.2vmin,34px);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  h1{margin:0;font-size:clamp(34px,9vmin,110px);line-height:1;letter-spacing:-.03em;
    background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  #qr{background:#fff;padding:2.4vmin;border-radius:3vmin;box-shadow:0 0 80px rgba(124,92,255,.45)}
  #qr img,#qr canvas{display:block;width:min(52vmin,520px);height:min(52vmin,520px)}
  .url{font-size:clamp(14px,2.6vmin,26px);color:var(--muted);word-break:break-all}
  .beer{font-size:clamp(16px,3.4vmin,34px);color:var(--beer);font-weight:700}
  .tools{position:fixed;top:12px;right:12px;display:flex;gap:8px;opacity:0;transition:opacity .3s}
  body:hover .tools{opacity:1}
  .tools button{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid #333;background:#1a1826;color:#fff;cursor:pointer}
  @media print{
    body{background:#fff;color:#000}.dj,.url{color:#444}h1{color:#000;background:none;-webkit-text-fill-color:#000}
    #qr{box-shadow:none;border:2px solid #000}.beer{color:#000}.tools{display:none}
  }
</style>
</head>
<body>
  <div class="side">
    <img class="logo" src="/logo.jpg" alt="" onerror="this.remove()">
    <div class="dj" id="dj"></div>
  </div>
  <div class="side">
    <h1>Pide tu canción 🎵</h1>
    <div id="qr"></div>
    <div class="url" id="url"></div>
    <div class="beer" id="beer" hidden>🍺 …y si te gusta, invítame una cerveza</div>
  </div>
  <div class="tools"><button onclick="document.documentElement.requestFullscreen?.()">⛶ Pantalla completa</button><button onclick="print()">🖨 Imprimir</button></div>
<script src="/qrcode.min.js"></script>
<script>
let last = '';
async function load() {
  try {
    const i = await (await fetch('/api/info')).json();
    // con logo el nombre ya se ve en la imagen: solo mostramos el evento
    document.getElementById('dj').textContent = [document.querySelector('.logo') ? '' : i.djName, i.eventName].filter(Boolean).join(' · ');
    document.getElementById('beer').hidden = !i.hasTip;
    if (i.joinUrl !== last) {
      last = i.joinUrl;
      const q = document.getElementById('qr'); q.textContent = '';
      new QRCode(q, { text: i.joinUrl, width: 1024, height: 1024, correctLevel: QRCode.CorrectLevel.M });
      document.getElementById('url').textContent = i.joinUrl.replace(/\/$/, '');
    }
  } catch {}
}
load(); setInterval(load, 15000);
</script>
</body>
</html>
